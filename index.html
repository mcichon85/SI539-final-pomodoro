    </header>
    <main>
        <div class="timer-container">
            <div class="timer-buttons">
                <button class="pomodoro-timer">Pomodoro</button>
                <button class="shortbreak-timer">Short Break</button>
                <button class="longbreak-timer">Long Break</button>
            </div>
            <div class="timer-countdown">
                <ul>
                    <li><span id="minutes">25</span>minutes</li>
                    <li class="separator"><span>:</span></li>
                    <li><span id="seconds">00</span>seconds</li>
                </ul>
            </div>
            <div class="timer-settings">
                <button id="play-pause-btn">Play</button>
            </div>
        </div>
        <div class="todo-list-container">
            <div class="todo-list">
                <h2>🌿 To Do List 🌿</h2>
                <p id="todo-list-alert">Type a task in the text box below!</p>
                <div class="task-input-row">
                    <input class="task-input" placeholder="My next task is..."></input>
                    <button class="add-task-btn">Add</button>
                </div>
                <ul id="tasks-display">
                    <!-- <li class="checked-task">Task 1</li> -->
                </ul>
                </div>
            </div>

        </div>

    </main>
    <script src="js/pomodoro.js"></script>
